name: Probe Footballguys ADP

on:
  workflow_dispatch:
  push:
    paths:
      - 'fantasy-draft/research/probe_footballguys_adp.py'
      - '.github/workflows/probe-footballguys-adp.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python fantasy-draft/research/probe_footballguys_adp.py
