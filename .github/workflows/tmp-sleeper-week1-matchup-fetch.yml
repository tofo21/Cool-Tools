name: Temporary Sleeper Week 1 Matchup Fetch

on:
  push:
    branches:
      - codex/draft-runtime-contract-harness

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sleeper Week 1 matchup data
        shell: bash
        run: |
          set -euo pipefail
          LEAGUE='1389391302801522688'
          curl --fail-with-body -sS "https://api.sleeper.app/v1/league/${LEAGUE}/matchups/1?cb=1" -o matchups.json
          curl --fail-with-body -sS "https://api.sleeper.app/v1/league/${LEAGUE}/users" -o users.json
          curl --fail-with-body -sS "https://api.sleeper.app/v1/league/${LEAGUE}/rosters" -o rosters.json
          curl --fail-with-body -sS "https://api.sleeper.app/v1/players/nfl" -o players.json
          python - <<'PY'
          import json
          matchups=json.load(open('matchups.json'))
          users=json.load(open('users.json'))
          rosters=json.load(open('rosters.json'))
          players=json.load(open('players.json'))
          user_by_id={u.get('user_id'):u for u in users}
          roster_by_id={r.get('roster_id'):r for r in rosters}
          def pname(pid):
              if pid in ('0',0,None): return 'EMPTY'
              if isinstance(pid,str) and pid.isalpha() and len(pid)<=3:
                  return f'{pid} Defense'
              p=players.get(str(pid),{})
              return p.get('full_name') or ' '.join(x for x in [p.get('first_name'),p.get('last_name')] if x) or str(pid)
          def ppos(pid):
              if isinstance(pid,str) and pid.isalpha() and len(pid)<=3: return 'DEF'
              return players.get(str(pid),{}).get('position','')
          def pteam(pid):
              if isinstance(pid,str) and pid.isalpha() and len(pid)<=3: return pid
              return players.get(str(pid),{}).get('team','') or ''
          print('=== WEEK1 MATCHUPS ===')
          for m in sorted(matchups,key=lambda x:(x.get('matchup_id') or 999,x.get('roster_id') or 999)):
              rid=m.get('roster_id')
              r=roster_by_id.get(rid,{})
              u=user_by_id.get(r.get('owner_id'),{})
              team=(u.get('metadata') or {}).get('team_name') or u.get('display_name') or f'Roster {rid}'
              starters=m.get('starters') or []
              print(f'MATCHUP\t{m.get("matchup_id")}\tROSTER\t{rid}\tTEAM\t{team}\tOWNER\t{u.get("display_name","")}')
              for i,pid in enumerate(starters,1):
                  print(f'STARTER\t{i}\t{pid}\t{pname(pid)}\t{ppos(pid)}\t{pteam(pid)}')
              print('---')
          print('=== RAW MATCHUPS ===')
          print(json.dumps(matchups,sort_keys=True))
          PY
