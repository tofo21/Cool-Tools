name: Inspect Fantasy Fundamentals Sources

on:
  workflow_dispatch:
  push:
    paths:
      - 'fantasy-draft/research/inspect_fundamentals_sources_v07.py'
      - '.github/workflows/inspect-fantasy-fundamentals.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      - name: Inspect source schemas
        run: python fantasy-draft/research/inspect_fundamentals_sources_v07.py

      - name: Upload schema probe
        uses: actions/upload-artifact@v4
        with:
          name: fundamentals-source-schema-probe-v0-7
          path: fantasy-draft/research/output/fundamentals_source_schema_probe_v07.json
          if-no-files-found: error
          retention-days: 7
