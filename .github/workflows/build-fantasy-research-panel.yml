name: Build Fantasy Research Panel

on:
  workflow_dispatch:
  push:
    paths:
      - 'fantasy-draft/research/**'
      - '.github/workflows/build-fantasy-research-panel.yml'

permissions:
  contents: read

jobs:
  build-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Inspect FantasyPros HTML
        run: python fantasy-draft/research/diagnose_fp_html.py
