name: Build Fantasy Research Panel

on:
  workflow_dispatch:
  push:
    paths:
      - 'fantasy-draft/research/*.py'
      - 'fantasy-draft/research/scorecard_v08_payload/**'
      - '.github/workflows/build-fantasy-research-panel.yml'

permissions:
  contents: read

jobs:
  build-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests pyarrow rapidfuzz lxml pypdf scipy scikit-learn tabulate

      - name: Build 2020-2025 master player-season panel
        run: python fantasy-draft/research/build_master_panel.py

      - name: Finalize identity and QA
        run: python fantasy-draft/research/finalize_panel_v01.py

      - name: Attach ESPN and Sleeper platform layers
        run: python fantasy-draft/research/attach_platform_layers_v02c.py

      - name: Attach frozen Step 8 consensus projection layer
        run: python fantasy-draft/research/attach_preserved_consensus_v04.py

      - name: Attach Step 9 high-stakes market layer
        run: python fantasy-draft/research/build_high_stakes_market_v05b.py

      - name: Attach Step 10 sportsbook market layer
        run: python fantasy-draft/research/build_sportsbook_market_v06c.py

      - name: Attach Step 11 football fundamentals layer
        run: python fantasy-draft/research/build_football_fundamentals_v07.py

      - name: Step 12 regression primary walk-forward
        run: python fantasy-draft/research/build_walk_forward_signal_scorecard_v08.py --phase regression-primary

      - name: Step 12 regression same-source sensitivity
        run: python fantasy-draft/research/build_walk_forward_signal_scorecard_v08.py --phase regression-sensitivity

      - name: Step 12 probability calibration
        run: python fantasy-draft/research/build_walk_forward_signal_scorecard_v08.py --phase classification

      - name: Step 12 nested high-stakes tests
        run: python fantasy-draft/research/build_walk_forward_signal_scorecard_v08.py --phase high-stakes

      - name: Step 12 aggregate signal scorecard
        run: python fantasy-draft/research/build_walk_forward_signal_scorecard_v08.py --phase aggregate

      - name: Upload research and scorecard artifact
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-draft-signal-scorecard-v0-8
          path: fantasy-draft/research/output/
          if-no-files-found: error
          retention-days: 30
